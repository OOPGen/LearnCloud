function setSEO(path){
  const seo = ROUTES_SEO[path] || ROUTES_SEO["/"];
  document.title = seo.title;
  document.querySelector('meta[name="description"]').setAttribute('content', seo.desc);
  document.getElementById('og-title').setAttribute('content', seo.title);
  document.getElementById('og-desc').setAttribute('content', seo.desc);
  document.getElementById('og-url').setAttribute('content', `https://learncloud.co.zw${path}`);
  document.getElementById('og-type').setAttribute('content', seo.type);
  document.getElementById('tw-title').setAttribute('content', seo.title);
  document.getElementById('tw-desc').setAttribute('content', seo.desc);
  document.getElementById('canonical-link').setAttribute('href', `https://learncloud.co.zw${path}`);
  // FAQ structured data for pricing
  if(path==="/pricing"){
    const faqData={
      "@context":"https://schema.org",
      "@type":"FAQPage",
      "mainEntity":[
        {"@type":"Question","name":"What does a school actually pay?","acceptedAnswer":{"@type":"Answer","text":"You pay per learner per term, with a minimum charge. Starter $0.50 per learner min $99 for up to 300 learners, Growth $1.00 min $149 up to 800, Scale $2.00 min $199 up to 2000. Billable learner count is snapshot at term start. Example: 542 learners on Growth = 542*1.00=$542 that term, not $149 minimum."}},
        {"@type":"Question","name":"How does billing work?","acceptedAnswer":{"@type":"Answer","text":"Billing aligns to school term. At term start we snapshot active enrolments. Invoice issued with number PLAT-2026-00001, due 14 days. Manual payment capture at first, PayNow gateway later. Upgrade immediate with pro-rata charge, downgrade next period."}},
        {"@type":"Question","name":"What happens at end of 14-day trial?","acceptedAnswer":{"@type":"Answer","text":"No card required for trial. Reminders day 7, 12 and expiry. After expiry 30-day read-only window with banner and payment link. You can view and export records but cannot edit. Data never deleted. After 30 days archived but restorable. Pay during read-only to reactivate and keep data."}},
        {"@type":"Question","name":"What if learner count changes mid-term?","acceptedAnswer":{"@type":"Answer","text":"Billable count is snapshot at period start, so mid-term joiners don't increase that term's bill. Over learner limit warning shows, but no immediate charge. Next term snapshot will include them."}},
        {"@type":"Question","name":"Can we cancel?","acceptedAnswer":{"@type":"Answer","text":"Yes, anytime. Cancellation effective at next period start for downgrade, immediate for upgrade. Data retained 7 years per Ministry. Export CSV available. Suspension is read-only, never lock out entirely — you can always export."}}
      ]
    };
    document.getElementById('faq-jsonld').textContent = JSON.stringify(faqData);
  } else {
    document.getElementById('faq-jsonld').textContent = "";
  }
}

// --- Router ---
function App(){
  const [path,setPath]=useState(window.location.pathname);
  const [blogSlug,setBlogSlug]=useState(null);

  function navigate(to){
    const [base, query] = to.split("?");
    if(base.startsWith("/blog/")){
      const slug = base.split("/blog/")[1];
      setBlogSlug(slug);
      window.history.pushState({}, "", to);
      setPath("/blog-post");
    } else {
      setBlogSlug(null);
      window.history.pushState({}, "", to);
      setPath(base);
    }
    setSEO(base);
    window.scrollTo(0,0);
    trackConversion('page_view', {page: base});
  }

  useEffect(()=>{
    const onPopState=()=>{
      const p=window.location.pathname;
      if(p.startsWith("/blog/") && p!=="/blog"){
        setBlogSlug(p.split("/blog/")[1]);
        setPath("/blog-post");
      } else {
        setBlogSlug(null);
        setPath(p);
      }
      setSEO(p);
    };
    window.addEventListener('popstate', onPopState);
    setSEO(path);
    // Intercept link clicks for SPA
    const handler=e=>{
      const a=e.target.closest('a');
      if(a && a.href && a.origin===window.location.origin && !a.target && a.getAttribute('href')?.startsWith('/')){
        e.preventDefault();
        navigate(a.getAttribute('href'));
      }
    };
    document.addEventListener('click', handler);
    return ()=>{ window.removeEventListener('popstate', onPopState); document.removeEventListener('click', handler); };
  },[]);

  return h('div',null,
    h(Header,{currentPath:path,navigate}),
    path==="/" && h(HomePage,{navigate}),
    path==="/features" && h(FeaturesPage,{navigate}),
    path==="/pricing" && h(PricingPage,{navigate}),
    path==="/about" && h(AboutPage,null),
    path==="/contact" && h(ContactPage,null),
    path==="/book-a-demo" && h(BookDemoPage,null),
    path==="/blog" && h(BlogIndexPage,{navigate}),
    path==="/blog-post" && h(BlogPostTemplate,{slug:blogSlug,navigate}),
    path==="/privacy" && h(PrivacyPage,null),
    path==="/terms" && h(TermsPage,null),
    path==="/security" && h(SecurityPage,null),
    path==="/help" && h(HelpCentrePage,{navigate}),
    !["/","/features","/pricing","/about","/contact","/book-a-demo","/blog","/blog-post","/privacy","/terms","/security","/help"].includes(path) && h('main',{className:"py-20 text-center"},h('h1',{className:"text-2xl font-bold"},"Page not found"),h('p',{className:"mt-2 text-sm text-neutral-600"},"Go to ",h('a',{href:"/",onClick:e=>{e.preventDefault();navigate('/');},className:"text-primary-800 underline"},"home")),h('div',{className:"mt-4 text-xs text-neutral-400"},"Path: "+path)),
    h(Footer,{navigate})
  );
}

root.render(h(App));
</script>
