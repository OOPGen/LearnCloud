# LearnCloud Nginx - TLS, HTTP to HTTPS redirect, wildcard subdomain routing for tenants, security headers, gzip, static caching, request size limits
# Single server, scales to second server without rework (use same config, add upstream for api)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging - structured JSON for easier parsing, rotation handled by docker json-file
    log_format main_json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_ip":"$remote_addr",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"tenant":"$tenant_slug",'
        '"user_agent":"$http_user_agent"'
    '}';

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" tenant:$tenant_slug rt:$request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M; # request size limits - 20M for logo upload, CSV import
    client_body_timeout 30s;
    client_header_timeout 10s;

    # Gzip - fast on slow connection
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml
        font/woff
        font/woff2;

    # Security headers - SECURITY H2+C2 FIX
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection deprecated, set to 0 and rely on CSP
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP - Premium enterprise, prevents XSS via SVG/logo etc
    # For marketing site: allow self, cdn.tailwind, unpkg for React UMD, but no unsafe-eval
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://unpkg.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.learncloud.co.zw https://api.learncloud.co.zw https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    # HSTS - only when TLS enabled
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    
    # WAF - Basic protection against SQLi, XSS, common attacks
    # For full WAF, use ModSecurity with OWASP CRS, but these are lightweight Nginx rules
    
    # Block common SQL injection patterns in args
    # Note: This is basic, for full protection use ModSecurity
    map $request_uri $waf_block_sql {
        default 0;
        ~*"(union.*select|select.*from|insert.*into|drop.*table|--|;|\bOR\b.*=)" 1;
    }
    
    # Block XSS patterns
    map $request_uri $waf_block_xss {
        default 0;
        ~*"(\<script|javascript:|onload=|onerror=)" 1;
    }
    
    # Block path traversal
    map $request_uri $waf_block_traversal {
        default 0;
        ~*"(\.\./|\.\.\\)" 1;
    }

    # Rate limiting already defined: login 5r/m, general 100r/m
    # Additional: Limit file uploads to 2M already via client_max_body_size

    # Rate limiting - per IP for login/registration
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;

    # Map tenant slug from host for logging and routing
    map $host $tenant_slug {
        default "";
        ~^(?<slug>[a-z0-9-]+)\.learncloud\.co\.zw$ $slug;
        ~^(?<slug>[a-z0-9-]+)\.learncloud\.co\.com$ $slug;
    }

    # Upstreams - for scaling to second server later without rework, change here to IP of second server
    upstream api_backend {
        # Single server now
        server api:8080 max_fails=3 fail_timeout=30s;
        # For second server, add:
        # server 10.0.0.11:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream web_backend {
        server web:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HTTP to HTTPS redirect - always
    server {
        listen 80;
        listen [::]:80;
        server_name *.learncloud.co.zw learncloud.co.zw www.learncloud.co.zw;

        # For Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS main server - wildcard
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name *.learncloud.co.zw learncloud.co.zw www.learncloud.co.zw;

        # TLS - replace with real certs from Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/learncloud.co.zw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/learncloud.co.zw/privkey.pem;
        # For wildcard: /etc/letsencrypt/live/learncloud.co.zw/fullchain.pem with SAN *.learncloud.co.zw

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers with HSTS when TLS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Static asset caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            # Try to serve from web backend, but cache
            proxy_pass http://web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API - /api/ and /health
        location ~ ^/(api|health)/ {
            # Rate limiting for sensitive endpoints
            limit_req zone=general burst=20 nodelay;

            # Extra rate limiting for login/registration
            location ~ ^/api/auth/(login|register-tenant|forgot-password) {
                limit_req zone=login burst=5 nodelay;
                proxy_pass http://api_backend;
                include /etc/nginx/conf.d/proxy_params.conf;
            }

            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy_params.conf;

            # Request size already 20M
        }

        # Web - all other requests (React marketing + app)
        location / {
            proxy_pass http://web_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Health endpoint for nginx itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Include additional configs
    include /etc/nginx/conf.d/*.conf;
}
