# Continuous integration for LearnCloud.
#
# Deployments are not done from here. Railway deploys the API from GitHub; turn on "Wait
# for CI" in the Railway service settings so it only deploys commits that pass this
# workflow. The web app and marketing site are Cloudflare Workers, deployed with Wrangler.
# See docs/DEPLOYMENT.md.

name: CI

# Every push to any branch, so feature branches are checked before they reach main, and
# Railway's "Wait for CI" sees a result for each main commit. Pull requests from
# branches in this repository are covered by the push run on their branch.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore LearnCloud.sln

      - name: Build
        run: dotnet build LearnCloud.sln --no-restore --configuration Release

      - name: Tenant isolation guards
        run: bash scripts/ci_tenant_isolation_guards.sh

      - name: Migrations match the model
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          dotnet ef migrations has-pending-model-changes \
            --project src/LearnCloud.Api --startup-project src/LearnCloud.Api \
            --no-build --configuration Release

      - name: No vulnerable packages
        run: |
          dotnet list LearnCloud.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -Eq '^\s+>' vulnerable.txt; then
            echo "::error::Packages with known vulnerabilities are referenced (see output above)."
            exit 1
          fi

      - name: Unit tests
        run: dotnet test tests/LearnCloud.UnitTests --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Integration tests (PostgreSQL via Testcontainers)
        run: dotnet test tests/LearnCloud.IntegrationTests --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image Railway deploys
        run: docker build --file deployment/docker/Dockerfile.api --tag learncloud-api:ci .

  web:
    name: Web and marketing Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/LearnCloud.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/LearnCloud.Web/package-lock.json

      - run: npm ci
      - run: npm run build
      - name: Web app Worker bundles (dry run, nothing is deployed)
        run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Marketing site Worker bundles (dry run, nothing is deployed)
        run: npx wrangler deploy --dry-run --config ../../marketing-site/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: "false"

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact --exit-code 1
